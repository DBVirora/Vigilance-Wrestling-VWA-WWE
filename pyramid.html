let ALL = [], CUT = 8, isDemo = false;

/* ---------------- data ---------------- */
async function loadData(){
  if(qs.get('demo') === '1'){ ALL = DEMO.slice(); isDemo = true; return; }
  try{
    const db = supabase.createClient(SUPA_URL, SUPA_KEY);
    const { data, error } = await db.from('v_rankings').select('*').order('overall_rank');

}
function visible(){
  let list = ALL.slice();
  if(filterDiv === '__none') list = list.filter(r => !r.division_id);
  else if(filterDiv) list = list.filter(r => r.division_id === filterDiv);
  if(filterFac) list = list.filter(r => (r.faction_name||'') === filterFac);
  if(champsOnly) list = list.filter(r => (r.belt_count||0) > 0);
  if(!showProv) list = list.filter(r => !r.provisional);
  return list.sort((a,b) => (b.vr||0) - (a.vr||0));
}

/* ---------------- node textures ---------------- */
const texCache = {};
function heatColor(awr){
  const t = Math.max(0, Math.min(1, ((awr || 0.5) - 0.3) / 0.5));
  const c1 = TH.heatLow, c2 = TH.heatMid, c3 = TH.heatHigh;
  const lerp = (a,b,k) => ({ r:a.r+(b.r-a.r)*k, g:a.g+(b.g-a.g)*k, b:a.b+(b.b-a.b)*k });
  const o = t < 0.5 ? lerp(c1, c2, t*2) : lerp(c2, c3, (t-0.5)*2);
  return 'rgb(' + Math.round(o.r) + ',' + Math.round(o.g) + ',' + Math.round(o.b) + ')';
}
function nodeTexture(r, rank, above){
  const key = [themeKey, r.wrestler_id, rank, above, r.vr].join('|');
  if(texCache[key]) return texCache[key];
  const S = 256, HGT = 330;
  const cv = document.createElement('canvas');
  cv.width = S; cv.height = HGT;
  const c = cv.getContext('2d');
  const cx = S/2, cy = 108, rad = 84;
  const isChamp = (r.belt_count||0) > 0;
  const ringCol = isChamp ? TH.ringChamp : (r.provisional ? TH.ringProv : (above ? TH.ringTop : TH.ringMid));
  const fill = heatColor(r.awr);

  c.save();
  c.beginPath(); c.arc(cx, cy, rad, 0, 7); c.closePath();
  c.fillStyle = thRgba(thDark(TH.void, 0.10), 0.95); c.fill();
  c.clip();
  const img = r._img;
  if(img){
    const side = Math.min(img.width, img.height);
    c.drawImage(img, (img.width-side)/2, Math.min(img.height-side, img.height*0.02), side, side, cx-rad, cy-rad, rad*2, rad*2);
  } else {
    c.fillStyle = fill; c.globalAlpha = 0.28; c.fillRect(cx-rad, cy-rad, rad*2, rad*2); c.globalAlpha = 1;
    const init = (r.name||'?').split(/\s+/).map(p=>p[0]).join('').slice(0,2).toUpperCase();
    c.fillStyle = fill; c.font = '700 62px Oswald, sans-serif';
    c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(init, cx, cy);
  }
  c.restore();

  c.beginPath(); c.arc(cx, cy, rad, 0, 7);
  c.lineWidth = isChamp ? 9 : 6; c.strokeStyle = ringCol; c.stroke();
  if(!r.provisional){
    c.beginPath(); c.arc(cx, cy, rad + 9, 0, 7);
    c.lineWidth = 2; c.strokeStyle = thRgba(thLight(TH.p, 0.35), 0.28); c.stroke();
  }

  c.beginPath(); c.arc(cx - rad*0.72, cy - rad*0.72, 26, 0, 7);
  c.fillStyle = thMix(TH.void, TH.deep, 0.5); c.fill();
  c.lineWidth = 3; c.strokeStyle = ringCol; c.stroke();

function thHx(h){ h = String(h).replace('#',''); if(h.length===3) h = h.split('').map(c=>c+c).join('');
  const n = parseInt(h,16); return { r:(n>>16)&255, g:(n>>8)&255, b:n&255 }; }
function thHex(r,g,b){ return '#' + [r,g,b].map(v => Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join(''); }
function thMix(a,b,t){ const x=thHx(a), y=thHx(b); return thHex(x.r+(y.r-x.r)*t, x.g+(y.g-x.g)*t, x.b+(y.b-x.b)*t); }
function thLight(c,t){ return thMix(c,'#ffffff',t); }
function thDark(c,t){ return thMix(c,'#000000',t); }
function thInt(c){ return parseInt(String(c).replace('#',''),16); }
function thTri(c){ const x=thHx(c); return [x.r/255, x.g/255, x.b/255]; }
function thRgba(c,a){ const x=thHx(c); return `rgba(${x.r},${x.g},${x.b},${a})`; }

function skyTexture(){
  const W = 2048, H = 1024;
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const c = cv.getContext('2d');
  const g = c.createLinearGradient(0, 0, 0, H);
  TH.skyStops.forEach((col, i) => g.addColorStop(i / (TH.skyStops.length - 1), col));
  c.fillStyle = g; c.fillRect(0, 0, W, H);

  const spots = [[330,250,420],[1180,190,380],[800,360,460],[1650,300,400],[120,520,380],[1450,620,340]];
  const clouds = spots.map(([x, y, r], i) => {
    const [col, a] = TH.clouds[i % TH.clouds.length];
    return [x, y, col, r, a * (i % 2 ? 0.8 : 1)];
  });
  clouds.forEach(([x, y, col, r, a]) => {
    const rg = c.createRadialGradient(x, y, 0, x, y, r);
    rg.addColorStop(0, col); rg.addColorStop(1, col + '00');
    c.globalAlpha = a; c.fillStyle = rg;
    c.beginPath(); c.arc(x, y, r, 0, 7); c.fill();
  });
  c.globalAlpha = 1;

  let seed = 8231;
  const rnd = () => (seed = (seed * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
  for(let i = 0; i < 1400; i++){
    const x = rnd() * W, y = rnd() * H, r = rnd() * 1.5 + 0.3;
    const t = rnd();
    c.fillStyle = t > 0.90 ? thRgba(TH.a, 0.85)

               : 'rgba(255,255,255,' + (0.30 + rnd() * 0.55) + ')';
    c.beginPath(); c.arc(x, y, r, 0, 7); c.fill();
  }
  return new THREE.CanvasTexture(cv);
}

function buildHelixDust(){
  const N = 2200, TURNS = 3.6;
  const pos = new Float32Array(N * 3), col = new Float32Array(N * 3);
  const par = new Float32Array(N * 3);   // t, angleJitter, radiusJitter
  for(let i = 0; i < N; i++){
    par[i*3]   = Math.random();
    par[i*3+1] = (Math.random() - 0.5) * 0.55;
    par[i*3+2] = (Math.random() - 0.5) * 1.5;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  COSMIC.helix = new THREE.Points(geo, new THREE.PointsMaterial({
    map: TEX.mote, size: 0.5, sizeAttenuation: true, transparent: true,
    opacity: 0.85, depthWrite: false, blending: THREE.AdditiveBlending, vertexColors: true, fog: false
  }));
  COSMIC.helix.userData = { par, N, TURNS };
  scene.add(COSMIC.helix);
  updateHelixDust(0);
}
function updateHelixDust(time){
  const h = COSMIC.helix; if(!h) return;
  const { par, N, TURNS } = h.userData;
  const pos = h.geometry.attributes.position.array;
  const col = h.geometry.attributes.color.array;
  for(let i = 0; i < N; i++){
    let t = par[i*3] + time * 0.035;
    t -= Math.floor(t);
    const hN = 0.04 + t * 0.92;
    const y = hN * H_PYR;
    const rad = Math.max(0.5, R_BASE * (1 - hN) * 0.80) + par[i*3+2] * (1 - hN);
    const th = t * Math.PI * 2 * TURNS + par[i*3+1];
    pos[i*3]   = Math.cos(th) * rad;
    pos[i*3+1] = y;
    pos[i*3+2] = Math.sin(th) * rad;
    // theme primary at the base burning to the accent at the peak
    const k = Math.pow(t, 1.4);
    const lo = TH.helixLow, hi = TH.helixHigh;
    col[i*3]   = lo[0] + (hi[0] - lo[0]) * k;
    col[i*3+1] = lo[1] + (hi[1] - lo[1]) * k;
    col[i*3+2] = lo[2] + (hi[2] - lo[2]) * k;
  }
  h.geometry.attributes.position.needsUpdate = true;
  h.geometry.attributes.color.needsUpdate = true;
}

function stepComets(t, dt){
  COSMIC.comets.forEach(c => {
    const u = c.userData;
    if(u.life < 0){
      u.next -= dt;
      if(u.next <= 0){
        const a = Math.random() * Math.PI * 2, r = 70 + Math.random() * 50;
        u.from.set(Math.cos(a) * r, 24 + Math.random() * 40, Math.sin(a) * r);
        const b = a + (Math.random() > 0.5 ? 1 : -1) * (0.7 + Math.random() * 0.9);
        u.to.set(Math.cos(b) * r, u.from.y - 18 - Math.random() * 22, Math.sin(b) * r);
        u.life = 0;
      }
    } else {
      u.life += dt / 1.5;
      if(u.life >= 1){ u.life = -1; u.next = 6 + Math.random() * 16; c.material.opacity = 0; return; }
      c.position.lerpVectors(u.from, u.to, u.life);
      c.material.opacity = Math.sin(u.life * Math.PI) * 0.85;
      const s = 2.0 + Math.sin(u.life * Math.PI) * 2.6;
      c.scale.set(s, s, 1);
    }
  });
}

function buildPyramid(){
  pyramidGroup = new THREE.Group();
  const apex = new THREE.Vector3(0, H_PYR, 0);
  const corners = [];
  for(let i=0;i<4;i++){
    const a = (i/4)*Math.PI*2 + Math.PI/4;
    corners.push(new THREE.Vector3(Math.cos(a)*R_BASE, 0, Math.sin(a)*R_BASE));
  }
  const edgeMat = new THREE.LineBasicMaterial({ color:TH.edge, transparent:true, opacity:0.75, blending:THREE.AdditiveBlending });
  const pts = [];
  corners.forEach((c, i) => {
    pts.push(c.clone(), apex.clone());
    pts.push(c.clone(), corners[(i+1)%4].clone());
  });
  pyramidGroup.add(new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(pts), edgeMat));

  const faceMat = new THREE.MeshBasicMaterial({ color:TH.face, transparent:true, opacity:0.075, side:THREE.DoubleSide, depthWrite:false, blending:THREE.AdditiveBlending });
  const cone = new THREE.Mesh(new THREE.ConeGeometry(R_BASE, H_PYR, 4, 1, true), faceMat);
  cone.position.y = H_PYR/2; cone.rotation.y = Math.PI/4;
  pyramidGroup.add(cone);

  const tierMat = new THREE.LineBasicMaterial({ color:TH.face, transparent:true, opacity:0.16 });
  for(let t=1;t<=5;t++){
    const h = (t/6)*H_PYR, rr = R_BASE*(1 - h/H_PYR);
    const ring = [];
    for(let i=0;i<=4;i++){
      const a = (i/4)*Math.PI*2 + Math.PI/4;
      ring.push(new THREE.Vector3(Math.cos(a)*rr, h, Math.sin(a)*rr));
    }
    pyramidGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(ring), tierMat));
  }

  // cosmic floor — a pool of light instead of a wireframe grid
  const fcv = document.createElement('canvas'); fcv.width = fcv.height = 512;
  const fc = fcv.getContext('2d');
  const fg = fc.createRadialGradient(256, 256, 0, 256, 256, 256);
  fg.addColorStop(0.00, TH.floorStops[0]);
  fg.addColorStop(0.22, TH.floorStops[1]);
  fg.addColorStop(0.60, TH.floorStops[2]);
  fg.addColorStop(1.00, 'rgba(0,0,0,0)');
  fc.fillStyle = fg; fc.fillRect(0, 0, 512, 512);
  const floor = new THREE.Mesh(
    new THREE.CircleGeometry(R_BASE * 2.4, 64),
    new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(fcv), transparent: true,
      opacity: 0.85, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide, fog: false })
  );
  floor.rotation.x = -Math.PI / 2; floor.position.y = -0.05;
  pyramidGroup.add(floor);
  COSMIC.floor = floor;

  const ringMat = new THREE.LineBasicMaterial({ color:TH.face, transparent:true, opacity:0.13 });
  for(let k = 1; k <= 4; k++){
    const rr = R_BASE * (0.55 + k * 0.42), pts2 = [];
    for(let i = 0; i <= 72; i++){
      const a = (i/72) * Math.PI * 2;
      pts2.push(new THREE.Vector3(Math.cos(a)*rr, -0.04, Math.sin(a)*rr));
    }
    pyramidGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts2), ringMat));
  }

  // brand crest hovering over the vacant throne
  const crestTex = new THREE.TextureLoader().load(VWA_LOGO);
  const crest = new THREE.Sprite(new THREE.SpriteMaterial({ map:crestTex, transparent:true,
    opacity:0.92, depthWrite:false, fog:false }));
  crest.scale.set(7, 7, 1);
  crest.position.set(0, H_PYR + 7.4, 0);
  crest.name = 'crest';
  pyramidGroup.add(crest);

  const spark = new THREE.Mesh(new THREE.SphereGeometry(0.42, 16, 16),
    new THREE.MeshBasicMaterial({ color:TH.apex, transparent:true, opacity:0.9 }));
  spark.position.copy(apex);
  spark.name = 'apex';
  pyramidGroup.add(spark);
  const halo = new THREE.Mesh(new THREE.SphereGeometry(1.5, 16, 16),
    new THREE.MeshBasicMaterial({ color:TH.apex, transparent:true, opacity:0.10, depthWrite:false }));
  halo.position.copy(apex); halo.name = 'halo';
  pyramidGroup.add(halo);

  scene.add(pyramidGroup);
}
function buildCutPlane(){
  const geo = new THREE.CircleGeometry(1, 48);
  cutMesh = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({
    color:TH.cut, transparent:true, opacity:0.09, side:THREE.DoubleSide, depthWrite:false }));
  cutMesh.rotation.x = -Math.PI/2;
  scene.add(cutMesh);
  cutRing = new THREE.Mesh(new THREE.RingGeometry(0.98, 1, 48), new THREE.MeshBasicMaterial({
    color:TH.cut, transparent:true, opacity:0.75, side:THREE.DoubleSide, depthWrite:false }));
  cutRing.rotation.x = -Math.PI/2;
  scene.add(cutRing);
}
function heightFor(r, i, list){
  const vrs = list.map(x => x.vr || 0);
  const lo = Math.min(...vrs), hi = Math.max(...vrs);
  let h;
  if(hi - lo < 1) h = list.length > 1 ? 1 - i/(list.length-1) : 0.5;
  else h = ((r.vr||0) - lo) / (hi - lo);
  return 0.10 + h * 0.78;
}
async function buildNodes(){
  if(nodeGroup){ scene.remove(nodeGroup); }
  nodeGroup = new THREE.Group();
  nodes = []; COSMIC.thread = null;
  const list = visible();
  await Promise.all(list.slice(0, 40).map(loadPhoto));

  list.forEach((r, i) => {
    const hN = heightFor(r, i, list);
    const y = hN * H_PYR;
    const rad = Math.max(1.4, R_BASE * (1 - hN) * 0.80);
    const theta = i * 2.399963;
    const above = i < CUT && !r.provisional;
    const tex = nodeTexture(r, i + 1, above);
    const mat = new THREE.SpriteMaterial({ map:tex, transparent:true, depthWrite:false,
      opacity: r.provisional ? 0.55 : 1 });
    const sp = new THREE.Sprite(mat);
    const proven = Math.min(1, (r.counted_matches || 0) / 6);
    const s = 2.5 * (0.66 + 0.44 * proven);
    sp.scale.set(s, s * (330/256), 1);
    sp.position.set(Math.cos(theta)*rad, y, Math.sin(theta)*rad);
    sp.renderOrder = 2;
    sp.userData = { r, rank:i+1, above, baseY:y, phase: i * 0.9 };

    const isChamp = (r.belt_count||0) > 0;
    const auraCol = isChamp ? TH.auraChamp : (r.provisional ? TH.auraProv : (above ? TH.auraTop : TH.auraMid));
    const aura = new THREE.Sprite(new THREE.SpriteMaterial({
      map: TEX.glow, color: auraCol, transparent: true, depthWrite: false,
      blending: THREE.AdditiveBlending, opacity: r.provisional ? 0.16 : (above ? 0.42 : 0.24), fog: false
    }));
    const ag = s * (isChamp ? 2.6 : above ? 2.2 : 1.8);
    aura.scale.set(ag, ag, 1);
    aura.position.copy(sp.position);
    aura.renderOrder = 1;
    sp.userData.aura = aura;
    sp.userData.auraBase = aura.material.opacity;
    nodeGroup.add(aura);

    nodeGroup.add(sp);
    nodes.push(sp);
  });

  // faint thread linking the ranks in order — the constellation of the climb
  if(nodes.length > 1){
    const tp = nodes.map(n => n.position.clone());
    COSMIC.thread = new THREE.Line(
      new THREE.BufferGeometry().setFromPoints(tp),
      new THREE.LineBasicMaterial({ color:TH.auraTop, transparent:true, opacity:0.18,
        depthWrite:false, blending:THREE.AdditiveBlending })
    );
    nodeGroup.add(COSMIC.thread);
  }

  // cut-line height sits between the last qualifier and the first outside it
  const elig = list.filter(x => !x.provisional);
  if(elig.length > CUT){
    const a = list.indexOf(elig[CUT-1]), b = list.indexOf(elig[CUT]);
    const hy = (heightFor(elig[CUT-1], a, list) + heightFor(elig[CUT], b, list)) / 2 * H_PYR;
    const rr = R_BASE * (1 - hy/H_PYR) * 1.02;
    cutMesh.position.y = hy; cutMesh.scale.set(rr, rr, 1);
    cutRing.position.y = hy; cutRing.scale.set(rr, rr, 1);
    cutMesh.visible = cutRing.visible = showCut;
  } else {
    cutMesh.visible = cutRing.visible = false;
  }
  scene.add(nodeGroup);
}

/* ---------------- camera control ---------------- */
function applyCamera(){
  const p = view;
  camera.position.set(
    p.target.x + p.radius * Math.sin(p.phi) * Math.sin(p.theta),
    p.target.y + p.radius * Math.cos(p.phi),
    p.target.z + p.radius * Math.sin(p.phi) * Math.cos(p.theta)
  );
  camera.lookAt(p.target);
}
function bindControls(el){
  let dragging = false, lx = 0, ly = 0, moved = 0;
  const down = e => { dragging = true; moved = 0;
    const t = e.touches ? e.touches[0] : e; lx = t.clientX; ly = t.clientY; };
  const move = e => {
    if(!dragging) return;
    const t = e.touches ? e.touches[0] : e;
    const dx = t.clientX - lx, dy = t.clientY - ly;
    lx = t.clientX; ly = t.clientY; moved += Math.abs(dx) + Math.abs(dy);
    view.theta -= dx * 0.006;
    view.phi = Math.max(0.22, Math.min(1.62, view.phi - dy * 0.005));
    applyCamera();
    if(e.cancelable) e.preventDefault();
  };
  const up = e => {
    if(dragging && moved < 8){
      const t = e.changedTouches ? e.changedTouches[0] : e;
      if(t && t.clientX !== undefined) pick(t);
    }
    dragging = false;
  };
  el.addEventListener('mousedown', down);
  window.addEventListener('mousemove', move);
  window.addEventListener('mouseup', up);
  el.addEventListener('touchstart', down, { passive:true });
  window.addEventListener('touchmove', move, { passive:false });
  window.addEventListener('touchend', up);
  el.addEventListener('wheel', e => {
    view.radius = Math.max(14, Math.min(72, view.radius + e.deltaY * 0.03));
    applyCamera(); e.preventDefault();
  }, { passive:false });
}
function pick(e){
  const rect = renderer.domElement.getBoundingClientRect();
  const m = new THREE.Vector2(
    ((e.clientX - rect.left)/rect.width)*2 - 1,
    -((e.clientY - rect.top)/rect.height)*2 + 1
  );
  raycaster.setFromCamera(m, camera);
  const hit = raycaster.intersectObjects(nodes, false)[0];
  if(hit) openPanel(hit.object.userData);
  else closePanel();
}

function setCssVars(){

async function applyTheme(key, custom){
  themeKey = custom ? 'custom' : key;
  TH = custom ? custom : buildTheme(Object.assign({ key }, THEME_DEFS[key] || THEME_DEFS.vwa));
  setCssVars();
  if(!scene) return;

  // backdrop
  if(COSMIC.sky){
    if(COSMIC.sky.material.map) COSMIC.sky.material.map.dispose();
    COSMIC.sky.material.map = skyTexture();
    COSMIC.sky.material.needsUpdate = true;
  }
  if(scene.fog){ scene.fog.color.setHex(TH.fog); scene.fog.density = TH.fogD; }

  // star tints
  COSMIC.stars.forEach(pts => {
    const col = pts.geometry.attributes.color.array;
    const tint = pts.userData.tint;
    for(let i = 0; i < tint.length; i++){
      const c = TH.starTints[tint[i]];
      col[i*3] = c[0]; col[i*3+1] = c[1]; col[i*3+2] = c[2];
    }
    pts.geometry.attributes.color.needsUpdate = true;
  });
  if(COSMIC.dust) COSMIC.dust.material.color.setHex(TH.motes);
  if(COSMIC.sparks) COSMIC.sparks.material.color.setHex(TH.apex);
  if(COSMIC.beam){
    if(COSMIC.beam.material.map) COSMIC.beam.material.map.dispose();
    COSMIC.beam.material.map = beamTexture();
    COSMIC.beam.material.needsUpdate = true;
  }

  // structure — rebuilt so the floor texture regenerates cleanly
  if(pyramidGroup) scene.remove(pyramidGroup);
  buildPyramid();

  if(cutMesh){ cutMesh.material.color.setHex(TH.cut); }
  if(cutRing){ cutRing.material.color.setHex(TH.cut); }

  await buildNodes();      // node textures carry ring colours, so they regenerate
  if(selected) closePanel();
  try{ localStorage.setItem('vwa_pyr_theme', themeKey); }catch(e){}
}

const VWA_MUSIC_URL = 'https://github.com/DBVirora/Vigilance-Wrestling-VWA-WWE/raw/refs/heads/main/images%20folder/X-Men%20Legends%20OST%20101%20-%20Menu.mp3';
let bgm = null, bgmMuted = false, bgmStarted = false;

function initMusic(){
  try{ bgmMuted = localStorage.getItem('vwa_bgm_muted') === '1'; }catch(e){}
  bgm = new Audio(VWA_MUSIC_URL);
  bgm.loop = true;
  bgm.preload = 'auto';
  bgm.volume = 0;
  bgm.crossOrigin = 'anonymous';

  const fadeIn = () => {
    const target = bgmMuted ? 0 : 0.34;
    let v = bgm.volume;
    const step = () => {
      v = Math.min(target, v + 0.012);
      bgm.volume = v;
      if(v < target) requestAnimationFrame(step);
    };
    step();
  };
  const tryPlay = () => {
    if(bgmStarted) return;
    bgm.play().then(() => { bgmStarted = true; fadeIn(); syncMusicBtn(); })
      .catch(() => { /* browser blocked it — wait for a gesture */ });
  };
  tryPlay();
  // browsers require a gesture before audio; catch the first one
  const kick = () => {
    tryPlay();
    if(bgmStarted){
      ['pointerdown','keydown','touchstart','wheel'].forEach(ev =>
        window.removeEventListener(ev, kick));
    }
  };
  ['pointerdown','keydown','touchstart','wheel'].forEach(ev =>
    window.addEventListener(ev, kick, { passive:true }));

  // some browsers stall the loop on long buffers — belt and braces
  bgm.addEventListener('ended', () => { bgm.currentTime = 0; bgm.play().catch(()=>{}); });
  syncMusicBtn();
}
function toggleMusic(){
  bgmMuted = !bgmMuted;
  if(bgm){
    bgm.volume = bgmMuted ? 0 : 0.34;
    if(!bgmMuted && !bgmStarted) bgm.play().then(()=>{ bgmStarted = true; }).catch(()=>{});
  }
  try{ localStorage.setItem('vwa_bgm_muted', bgmMuted ? '1' : '0'); }catch(e){}
  syncMusicBtn();
}
function syncMusicBtn(){
  const b = document.getElementById('bMusic');
  if(!b) return;
  b.classList.toggle('on', !bgmMuted);
  b.innerHTML = (bgmMuted ? '🔇' : '🎵') + '<span class="mus-lbl">' +
    (bgmMuted ? 'Music off' : (bgmStarted ? 'Music on' : 'Tap to play')) + '</span>' +
    '<span class="eq ' + (!bgmMuted && bgmStarted ? 'live' : '') + '"><i></i><i></i><i></i></span>';
}

  renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
  renderer.setPixelRatio(Math.min(2, devicePixelRatio || 1));
  renderer.setSize(innerWidth, innerHeight);
  document.getElementById('stage').appendChild(renderer.domElement);
  raycaster = new THREE.Raycaster();

  buildCosmos();
  buildPyramid();
  buildCutPlane();

  animate();
}
let t0 = performance.now(), tPrev = t0;
function animate(){
  requestAnimationFrame(animate);
  const now = performance.now();
  const t = (now - t0) / 1000;
  const dt = Math.min(0.05, (now - tPrev) / 1000);
  tPrev = now;

  if(spin){ view.theta += 0.0016; applyCamera(); }

  // wrestlers drift, their auras breathe with them
  nodes.forEach(n => {
    const y = n.userData.baseY + Math.sin(t * 0.9 + n.userData.phase) * 0.11;
    n.position.y = y;
    const a = n.userData.aura;
    if(a){
      a.position.set(n.position.x, y, n.position.z);
      a.material.opacity = n.userData.auraBase * (0.78 + Math.sin(t * 1.5 + n.userData.phase) * 0.30);
    }
  });
  if(COSMIC.thread && nodes.length > 1){
    const arr = COSMIC.thread.geometry.attributes.position.array;
    nodes.forEach((n, i) => { arr[i*3] = n.position.x; arr[i*3+1] = n.position.y; arr[i*3+2] = n.position.z; });
    COSMIC.thread.geometry.attributes.position.needsUpdate = true;
    COSMIC.thread.material.opacity = 0.13 + Math.sin(t * 0.8) * 0.06;
  }

  // starfields turn at their own speeds for parallax
  COSMIC.stars.forEach(p => { p.rotation.y += p.userData.spin; });
  if(COSMIC.sky) COSMIC.sky.rotation.y += 0.00004;

  // motes rise and wrap
  if(COSMIC.dust){
    const pos = COSMIC.dust.geometry.attributes.position.array;
    const sd = COSMIC.dust.userData.seed;
    for(let i = 0; i < pos.length / 3; i++){
      pos[i*3+1] += sd[i*3+1] * dt * 0.5 * TH.rise;
      if(TH.rise >= 0){ if(pos[i*3+1] > 32) pos[i*3+1] = -3; }
      else if(pos[i*3+1] < -3) pos[i*3+1] = 32;
      const a = sd[i*3] + t * 0.06;
      pos[i*3]   = Math.cos(a) * sd[i*3+2];
      pos[i*3+2] = Math.sin(a) * sd[i*3+2];
    }
    COSMIC.dust.geometry.attributes.position.needsUpdate = true;
    COSMIC.dust.material.opacity = 0.45 + Math.sin(t * 0.7) * 0.12;
  }

  updateHelixDust(t);

  // the vacant throne
  const crest = pyramidGroup.getObjectByName('crest');
  if(crest){
    crest.position.y = H_PYR + 7.4 + Math.sin(t * 0.6) * 0.32;
    crest.material.opacity = 0.80 + Math.sin(t * 1.1) * 0.14;
  }
  const apex = pyramidGroup.getObjectByName('apex');
  const halo = pyramidGroup.getObjectByName('halo');
  if(apex) apex.material.opacity = 0.65 + Math.sin(t*2)*0.3;
  if(halo){ const k = 1 + Math.sin(t*2)*0.14; halo.scale.set(k,k,k); }
  if(COSMIC.beam){
    COSMIC.beam.material.opacity = 0.22 + Math.sin(t * 1.1) * 0.09;
    COSMIC.beam.rotation.y += 0.0011;
  }
  if(COSMIC.sparks){
    const { par, N } = COSMIC.sparks.userData;
    const sp = COSMIC.sparks.geometry.attributes.position.array;
    for(let i = 0; i < N; i++){
      const a = par[i*3] + t * (0.35 + par[i*3+1] * 0.16);
      const rr = par[i*3+1];
      sp[i*3]   = Math.cos(a) * rr;
      sp[i*3+1] = H_PYR + par[i*3+2] + Math.sin(t * 1.4 + par[i*3]) * 0.5;
      sp[i*3+2] = Math.sin(a) * rr;
    }
    COSMIC.sparks.geometry.attributes.position.needsUpdate = true;
  }
  if(COSMIC.floor) COSMIC.floor.material.opacity = 0.72 + Math.sin(t * 0.9) * 0.14;

  stepComets(t, dt);

  if(cutRing) cutRing.material.opacity = 0.55 + Math.sin(t*1.6)*0.22;
  if(cutMesh) cutMesh.material.opacity = 0.07 + Math.sin(t*1.6)*0.03;
  renderer.render(scene, camera);
}
init();
</script>
</body>
</html>
